name: Build Power BI mobile DAX editor release
on:
  push:
    branches: [codex/powerbi-mobile-dax-build]
permissions:
  contents: write
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4856d53f03623e4238034749b2bb6f4431190e7b
      - uses: actions/checkout@v4
        with:
          ref: 52452681c0485bca0a9d3f7a3cde54bae8cc5da0
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify the publication files
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(mktemp -d)"
          sh source/app/build/ghpack.sh
          bundle="$(find "$TMPDIR" -path '*/kesit-powerbi/kesit.js' -print -quit)"
          test -n "$bundle"
          package="${bundle%/kesit.js}"
          cmp config.js "$package/config.js"
          cp "$package/index.html" "$package/kesit.js" "$package/sw.js" .
          cp source/KALAN-GOREVLER.md .
          printf '%s  %s\n' bf814a1ff7c1c4a2cc85e7221d99740b28c6a2a9575b4137bcdd3358e62f6021 kesit.js e7e34e18134fcc1ea85c98dfc86e0a106296cfeba057ecba9758d8174752c449 index.html be6c0e72ce7815683fd5cd1621a43a06a78887d74aa6b96b26b6b7ef7f8a4403 sw.js | sha256sum -c -
          node --check kesit.js
          node source/tests/artifact.cjs
          node source/tests/yolval.js
          node tests/recovery.cjs source/app/recovery.js
          result="$(node tests/newdata.cjs)"
          echo "$result"
          test "$result" = '{"referenceSolutions":443,"fakeRejected":true,"alternativesAccepted":2}'
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = Path('release-manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['date'] = '2026-11-09'
          data['sourceCommit'] = '52452681c0485bca0a9d3f7a3cde54bae8cc5da0'
          data['checks'].append('Mobil DAX editörü, çalıştırma ve sonuç akışı')
          data['files'] = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in data['files']}
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Store the verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -- index.html kesit.js sw.js release-manifest.json KALAN-GOREVLER.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Yayın: mobil DAX editöründe kod ve sonuç akışı'
          git push origin HEAD:refs/heads/codex/powerbi-mobile-dax-verified
