name: Build Power BI delivery records release
on:
  push:
    branches: [codex/powerbi-evidence-build]
permissions:
  contents: write
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 150e87455ac01f310de001690b1362ff0b8f4cee
      - uses: actions/checkout@v4
        with:
          ref: fe1e323e63cbe396f634af1e8028b1a7fc97891d
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify the publication files
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(mktemp -d)"
          sh source/app/build/ghpack.sh
          bundle="$(find "$TMPDIR" -path '*/kesit-powerbi/kesit.js' -print -quit)"
          test -n "$bundle"
          package="${bundle%/kesit.js}"
          cmp index.html "$package/index.html"
          cmp config.js "$package/config.js"
          cp "$package/kesit.js" "$package/sw.js" .
          cp source/KALAN-GOREVLER.md .
          printf '%s  %s\n' eb19afbdba264bd2a51becb4913f11596da5c09163912967cd49c2387229ca96 kesit.js 33793f3ed7309ffd7f611437251f98f537c8bbcfc280455415ae3ebc96ef1681 sw.js | sha256sum -c -
          node --check kesit.js
          node source/tests/artifact.cjs
          node tests/recovery.cjs source/app/recovery.js
          result="$(node tests/newdata.cjs)"
          echo "$result"
          test "$result" = '{"referenceSolutions":443,"fakeRejected":true,"alternativesAccepted":2}'
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = Path('release-manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['date'] = '2026-11-09'
          data['sourceCommit'] = 'fe1e323e63cbe396f634af1e8028b1a7fc97891d'
          data['checks'].append('İlk uygulama ve bağımsız tekrar için ayrı teslim kayıtları')
          data['files'] = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in data['files']}
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Store the verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -- kesit.js sw.js release-manifest.json KALAN-GOREVLER.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Yayın: ilk uygulama ve bağımsız tekrar teslim kayıtları'
          git push origin HEAD:refs/heads/codex/powerbi-evidence-verified
