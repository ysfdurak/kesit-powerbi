name: Build Power BI keyboard focus release
on:
  push:
    branches: [codex/powerbi-keyboard-focus-build]
permissions:
  contents: write
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 34c27da197e537bdcfede4138f60d82eacf678eb
      - uses: actions/checkout@v4
        with:
          ref: 41122f0543c10c3232ad78d3fed6182e502cdfdd
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify the publication files
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(mktemp -d)"
          sh source/app/build/ghpack.sh
          bundle="$(find "$TMPDIR" -path '*/kesit-powerbi/kesit.js' -print -quit)"
          test -n "$bundle"
          package="${bundle%/kesit.js}"
          cmp config.js "$package/config.js"
          cp "$package/index.html" "$package/kesit.js" "$package/sw.js" .
          cp source/KALAN-GOREVLER.md .
          printf '%s  %s\n' b6d21e8852eda1b0796a8387ada5c661a1186864d66b56a2d177a604a8558756 kesit.js a33795b687c395427d61a2e3f23b0d555d263a4663d616ebc885ae1e58392d8f index.html 91b3535f2d226d71298970605f92abd16b74f01800f2175a4aed87555bc41aa5 sw.js | sha256sum -c -
          node --check kesit.js
          node source/tests/artifact.cjs
          node source/tests/yolval.js
          node tests/recovery.cjs source/app/recovery.js
          result="$(node tests/newdata.cjs)"
          echo "$result"
          test "$result" = '{"referenceSolutions":443,"fakeRejected":true,"alternativesAccepted":2}'
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = Path('release-manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['date'] = '2026-11-09'
          data['sourceCommit'] = '41122f0543c10c3232ad78d3fed6182e502cdfdd'
          data['checks'].append('Klavye odağı, DAX editörü, mobil gezinme ve rapor ayrıntısı')
          data['files'] = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in data['files']}
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Store the verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -- index.html kesit.js sw.js release-manifest.json KALAN-GOREVLER.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Yayın: görünür klavye odağı'
          git push origin HEAD:refs/heads/codex/powerbi-keyboard-focus-verified
