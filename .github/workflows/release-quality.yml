name: Published package quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/newdata.cjs
      - name: Verify recovery layer from published bundle
        run: |
          node -e "const s=require('fs').readFileSync('kesit.js','utf8').split(/\/\* ===== ([^\\n]+) ===== \*\//); const i=s.indexOf('recovery.js'); if(i<0)throw Error('recovery missing'); require('fs').writeFileSync('/tmp/recovery.js',s[i+1].trimStart());"
          node tests/recovery.cjs /tmp/recovery.js
      - name: Verify published file hashes
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib
          for name, expected in json.load(open('release-manifest.json'))['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
          PY
