name: Published package quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sürüm bildirimi (release-manifest.json) özetleri doğru mu
        run: node tests/manifest.cjs
      - name: kaynak dalındaki depo vakası kopyası güncel mi
        run: |
          git fetch --depth=1 origin kaynak
          git diff --exit-code FETCH_HEAD:app/build/gh/static/vaka/depo/index.html HEAD:vaka/depo/index.html || (echo "kaynak dalındaki app/build/gh/static/vaka/depo/index.html main'deki vaka/depo/index.html ile aynı değil; kaynak dalını güncelle." && exit 1)
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tests/newdata.cjs
      - run: node tests/vaka-depo.cjs
      - name: Verify recovery layer from published bundle
        run: |
          node -e "const s=require('fs').readFileSync('kesit.js','utf8').split(/\/\* ===== ([^\\n]+) ===== \*\//); const i=s.indexOf('recovery.js'); if(i<0)throw Error('recovery missing'); require('fs').writeFileSync('/tmp/recovery.js',s[i+1].trimStart());"
          node tests/recovery.cjs /tmp/recovery.js
      - name: Verify published file hashes
        run: |
          python3 - <<'PY'
          import json, hashlib, pathlib
          for name, expected in json.load(open('release-manifest.json'))['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == expected, name
          PY
